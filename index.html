<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>소연의 할 일</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>소연의 할 일</h1>

  <form>
    <input type="text" id="todo-input" placeholder="할 일을 써 주세요">
    <button type="button">추가</button>
  </form>

  <section id="summary">
    <p>오늘의 남은 할 일 <span class="num" id="remaining-count">0</span>개</p>
    <p class="sub">전체 <span class="num" id="total-count">0</span>개 중 <span class="num" id="done-count">0</span>개 완료</p>
  </section>

  <ul id="todo-list">
    <li>
      <input type="checkbox">
      <span>예시 할 일</span>
      <button type="button">삭제</button>
    </li>
  </ul>

  <p id="empty-message" hidden>할 일이 없어요</p>

  <script src="script.js"></script>
</body>
</html>
