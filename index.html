<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To do list</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>To do list</h1>

  <form>
    <input type="text" id="todo-input" placeholder="할 일을 써 주세요">
    <input type="time" id="todo-time" aria-label="수행할 시간(선택)">
    <input type="number" id="todo-minutes" min="1" max="999" inputmode="numeric" placeholder="타이머 분" aria-label="타이머 분(선택)">
    <button type="button">추가</button>
  </form>

  <section id="summary">
    <p>오늘의 남은 할 일 <span class="num" id="remaining-count">0</span>개</p>
    <p class="sub">전체 <span class="num" id="total-count">0</span>개 중 <span class="num" id="done-count">0</span>개 완료</p>
  </section>

  <ul id="todo-list">
    <li>
      <input type="checkbox">
      <div class="text">
        <span class="title">예시 할 일</span>
      </div>
      <button type="button">삭제</button>
    </li>
  </ul>

  <p id="empty-message" hidden>할 일이 없어요</p>

  <dialog id="praise">
    <p id="praise-message"></p>
    <button type="button" id="praise-close">닫기</button>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
